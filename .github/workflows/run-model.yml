name: Run Model — Generate Prediction

on:
  workflow_dispatch:
    inputs:
      doc_key:
        description: "Specific document key to process (leave empty for random)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Generate prediction
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_ID: ${{ secrets.HF_MODEL_ID || 'meta-llama/Llama-3.2-1B-Instruct' }}
        run: |
          python .github/scripts/generate_prediction.py \
            ${{ github.event.inputs.doc_key && format('--doc-key {0}', github.event.inputs.doc_key) || '' }}

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evaluator/data/predictions.json
          if git diff --cached --quiet; then
            echo "No changes to predictions.json"
          else
            git commit -m "Add LLM prediction [automated]"
            git push
          fi
