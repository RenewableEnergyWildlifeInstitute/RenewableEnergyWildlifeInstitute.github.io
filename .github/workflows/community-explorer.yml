name: Build Community Explorer Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  build-community-explorer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: .github/scripts/community_requirements.txt

      - name: Install dependencies
        run: pip install -r .github/scripts/community_requirements.txt

      - name: Build community explorer snapshot
        run: python .github/scripts/build_community_explorer.py

      - name: Commit and push explorer snapshot
        run: |
          if [ -z "$(git status --porcelain -- docs/rewi_community_explorer.html evaluator/data/community_explorer_snapshot.json)" ]; then
            echo "No community explorer changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rewi_community_explorer.html evaluator/data/community_explorer_snapshot.json
          git commit -m "chore: refresh monthly community explorer snapshot"
          git push
